<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" width="400" height="430" font-family="Times New Roman, serif" font-size="22" font-style="italic">
  <!-- 圆锥 PO：底面直径 AB=2，母线 PA=3，动点 M 的轨迹 L -->
  <!-- 底面椭圆（后半，虚线） -->
  <ellipse cx="200" cy="340" rx="140" ry="42" fill="none" stroke="#000" stroke-width="1.6" stroke-dasharray="6 5"/>
  <!-- 左右两条母线 -->
  <line x1="200" y1="40" x2="60" y2="340" stroke="#000" stroke-width="1.8"/>
  <line x1="200" y1="40" x2="340" y2="340" stroke="#000" stroke-width="1.8"/>
  <!-- 底面椭圆（前半，实线） -->
  <path d="M 60 340 A 140 42 0 0 0 340 340" fill="none" stroke="#000" stroke-width="1.8"/>
  <!-- 轴 PO（虚线） -->
  <line x1="200" y1="40" x2="200" y2="340" stroke="#000" stroke-width="1.5" stroke-dasharray="7 5"/>
  <!-- 底面直径 AB（虚线） -->
  <line x1="60" y1="340" x2="340" y2="340" stroke="#000" stroke-width="1.4" stroke-dasharray="6 5"/>
  <!-- 轨迹 L：背面段（虚线） -->
  <path d="M 60 340 C 120 300, 150 262, 196 240 C 240 219, 292 196, 318 188 C 270 150, 150 168, 96 246 C 78 276, 66 310, 60 340 Z"
        fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="7 5"/>
  <!-- 轨迹 L：正面段（实线） -->
  <path d="M 60 340 C 120 300, 168 256, 252 228 C 280 219, 302 202, 318 188"
        fill="none" stroke="#000" stroke-width="2"/>
  <!-- 点 M -->
  <circle cx="252" cy="228" r="3.4" fill="#000"/>
  <!-- 点 O -->
  <circle cx="200" cy="340" r="2.6" fill="#000"/>
  <!-- 标注 -->
  <text x="200" y="30" text-anchor="middle">P</text>
  <text x="46" y="348" text-anchor="end">A</text>
  <text x="356" y="348">B</text>
  <text x="200" y="372" text-anchor="middle">O</text>
  <text x="266" y="224">M</text>
  <text x="128" y="232">L</text>
</svg>
